[package]
name = "briefcase"
version = "0.1.1"
edition = "2021"
description = "Retained source evidence and task context with explicit provenance and coverage"
license = "MIT"
repository = "https://github.com/sij0sh/briefcase"
readme = "README.md"
include = [
  "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/README.md", "/AGENTS.md",
  "src/**/*.rs", "src/**/*.py", "src/**/*.cjs", "src/**/*.go", "src/**/*.java", "src/**/*.cs", "src/**/*.cpp", "src/**/*.h",
  "contracts/**/*.json", "contracts/**/*.md", "extensions/*.ts", "profiles/**/*.json",
  "tools/*.py", "tools/typescript/package.json", "tools/typescript/package-lock.json",
  "scripts/*.py", "scripts/*.sh", "scripts/*.ps1", "scripts/providers/*.py", "scripts/verify-*",
  "tests/*.rs", "tests/*.mjs", "tests/**/*.rs", "examples/*.rs", "docs/**/*.md",
  "architecture/**/*.yaml", "architecture/**/*.md",
  "/evaluation/outcome-protocol.json", "/evaluation/t3-p3-development-oracles.json",
  "/evaluation/repairs/**/*.json", "/evaluation/repairs/**/*.jsonl", "/evaluation/repairs/**/*.patch"
]
autotests = false

default-run = "briefcase"

[lib]
name = "briefcase"

[[bin]]
name = "briefcase"
path = "src/bin/briefcase.rs"

[[test]]
name = "core"
path = "tests/core.rs"

[[test]]
name = "toolchain_smoke"
path = "tests/toolchain_smoke.rs"

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[dependencies]
sha2 = "=0.11.1"
unicode-normalization = "=0.1.26"
regex = "=1.13.1"
tempfile = "=3.27.0"
clap = { version = "=4.6.7", features = ["derive"] }
ignore = "=0.4.33"
rusqlite = { version = "=0.40.2", features = ["bundled", "fallible_uint"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tree-sitter = "=0.27.1"
toml_edit = "=0.25.17"
tree-sitter-rust = "=0.24.2"
yaml-rust2 = "=0.13.0"
notify = "=8.2.0"

[[test]]
name = "context"
path = "tests/context.rs"

[[test]]
name = "stage2"
path = "tests/briefcase_stage2.rs"

[[test]]
name = "stage3"
path = "tests/briefcase_stage3.rs"

[[test]]
name = "stage4"
path = "tests/briefcase_stage4.rs"

[[test]]
name = "p0p1"
path = "tests/briefcase_p0_p1.rs"

[[test]]
name = "p2"
path = "tests/briefcase_p2.rs"

[[test]]
name = "impact"
path = "tests/briefcase_impact_contract.rs"
