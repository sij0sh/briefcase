name: Native release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    env:
      RUST_TEST_THREADS: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --lib
      - run: cargo test --locked --test impact
      - run: python3 -B -m unittest discover -s tools -p 'test_*.py'
      - run: node --test tests/briefcase-task-adapter.test.mjs
      - run: cargo clippy --locked --lib --bins --tests
      - run: cargo build --locked --release --bin briefcase
      - run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/package_release.py --target "$RELEASE_TARGET"
        env:
          RELEASE_TARGET: ${{ matrix.target }}
      - run: target/release/briefcase --version
      - name: Check packaged binary with released Archclt
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          python3 -m pip install https://github.com/sij0sh/archclt/releases/download/v0.2.0/archclt-0.2.0-py3-none-any.whl
          BRIEFCASE_SMOKE_DIR="$(mktemp -d)"
          tar -xzf "dist/briefcase-$RELEASE_TARGET.tar.gz" -C "$BRIEFCASE_SMOKE_DIR"
          python3 scripts/smoke_archclt.py --briefcase "$BRIEFCASE_SMOKE_DIR/briefcase"
      - name: Verify standard source crate
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo package --locked
          cp target/package/briefcase-*.crate dist/
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: dist/
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: artifacts
      - name: Collect checked artifacts
        run: |
          mkdir dist
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, shutil
          output=Path('dist')
          for pattern in ('*/*.tar.gz', '*/*.crate'):
              for archive in Path('artifacts').glob(pattern):
                  shutil.copy2(archive,output/archive.name)
          (output/'SHA256SUMS').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in sorted(output.iterdir()) if p.is_file()))
          PY
      - run: gh release create "$RELEASE_TAG" dist/* --repo "$GH_REPO" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
