name: Verification
on:
  push:
    branches: ['main']
  pull_request:
permissions:
  contents: read
jobs:
  context:
    name: Required lanes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Install the pinned TypeScript compiler
        run: npm ci --ignore-scripts --prefix tools/typescript
      - run: bash scripts/verify-context
  lint:
    name: Lint and package checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.24'
          cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - run: bash scripts/verify-lint
